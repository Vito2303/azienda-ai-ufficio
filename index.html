<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azienda AI – Ufficio 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;color:#e6edf5;font-family:system-ui}
#scene{position:fixed;inset:0}
.hud{position:fixed;top:12px;left:12px;background:rgba(16,22,30,.85);padding:8px 14px;border-radius:10px;border:1px solid #4fd1c5}
#feed{position:fixed;bottom:12px;left:12px;width:300px;max-height:25vh;overflow:auto;background:rgba(16,22,30,.9);padding:10px;border-radius:10px;font-size:13px}
button{margin:4px;padding:8px 12px;background:#4fd1c5;border:0;border-radius:8px;cursor:pointer}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud"><b>AZIENDA AI</b> – Ufficio 3D online</div>
<div id="feed"><b>Feed</b><br>Connesso ai bot Grok in background.<br>Parla con Azienda AI · Gruppo per aggiornamenti.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:true});
document.getElementById("scene").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(10,12,14);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
const light = new THREE.DirectionalLight(0xffffff, 0.8);
light.position.set(5,10,5); scene.add(light);
const floor = new THREE.Mesh(new THREE.BoxGeometry(16,0.2,12), new THREE.MeshStandardMaterial({color:0x2a313c}));
floor.position.y = -0.1; scene.add(floor);
const bots = [];
[["CEO",0xe94560,-4,-3],["Dev",0x00ff9d,-4,2],["Mkt",0xff6b6b,3,-3],["Ana",0x4ecdc4,3,2],["Des",0xa855f7,0,4],["Ast",0xf9c74f,4,4]].forEach(([n,c,x,z])=>{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.4,0.6,0.3), new THREE.MeshStandardMaterial({color:c}));
  body.position.y=1; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.18), new THREE.MeshStandardMaterial({color:0xf0d5c0}));
  head.position.y=1.5; g.add(head);
  g.position.set(x,0,z); scene.add(g); bots.push(g);
});
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
function animate(){ requestAnimationFrame(animate); bots.forEach(b=>b.rotation.y+=0.005); renderer.render(scene,camera); }
animate();
</script>
</body>
</html>
