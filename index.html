<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azienda AI – Ufficio 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1a2e;color:#eee;font-family:system-ui,sans-serif}
#scene{position:fixed;inset:0}
.hud{position:fixed;top:12px;left:12px;background:rgba(16,22,30,.9);padding:10px 16px;border-radius:10px;border:1px solid #4fd1c5;z-index:10}
#feed{position:fixed;bottom:12px;left:12px;width:min(320px,90vw);max-height:28vh;overflow:auto;background:rgba(16,22,30,.92);padding:12px;border-radius:10px;font-size:13px;z-index:10;border:1px solid #333}
.btn{position:fixed;top:12px;right:12px;background:#4fd1c5;color:#06201e;border:0;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;z-index:10}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud"><b>AZIENDA AI</b> – Ufficio 3D</div>
<button class="btn" onclick="meeting()">Riunione</button>
<div id="feed"><b>Feed comunicazioni</b><br>• Team pronto<br>• Parla con Azienda AI · Gruppo per aggiornamenti reali</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({antialias:true});
document.getElementById("scene").appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 25, 50);
const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 100);
camera.position.set(8, 10, 12);
camera.lookAt(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.8));
const light = new THREE.DirectionalLight(0xffffff, 1);
light.position.set(8,15,6); scene.add(light);
// Floor
const floor = new THREE.Mesh(new THREE.BoxGeometry(18,0.3,14), new THREE.MeshStandardMaterial({color:0x3a4a5c}));
floor.position.y = -0.15; scene.add(floor);
// Walls
const wallMat = new THREE.MeshStandardMaterial({color:0x4a90c8});
const back = new THREE.Mesh(new THREE.BoxGeometry(18,4,0.3), wallMat); back.position.set(0,2,-7); scene.add(back);
const left = new THREE.Mesh(new THREE.BoxGeometry(0.3,4,14), wallMat); left.position.set(-9,2,0); scene.add(left);
// Desks
function desk(x,z){
  const d = new THREE.Mesh(new THREE.BoxGeometry(2.2,0.1,1.2), new THREE.MeshStandardMaterial({color:0x8b5a2b}));
  d.position.set(x,0.7,z); scene.add(d);
  const mon = new THREE.Mesh(new THREE.BoxGeometry(0.6,0.4,0.05), new THREE.MeshStandardMaterial({color:0x111}));
  mon.position.set(x,1.1,z-0.3); scene.add(mon);
}
desk(-5,-3); desk(-5,2); desk(3,-3); desk(3,2); desk(0,4);
// Bots
const bots = [];
const data = [["CEO",0xe94560,-5,-3],["Dev",0x00ff9d,-5,2],["Mkt",0xff6b6b,3,-3],["Ana",0x4ecdc4,3,2],["Des",0xa855f7,0,4],["Ast",0xf9c74f,5,3]];
data.forEach(([name,col,x,z])=>{
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.8,0.35), new THREE.MeshStandardMaterial({color:col}));
  body.position.y = 1.2; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22,16,12), new THREE.MeshStandardMaterial({color:0xf0d5c0}));
  head.position.y = 1.8; g.add(head);
  g.position.set(x,0,z); scene.add(g);
  bots.push({g, home: new THREE.Vector3(x,0,z)});
});
function meeting(){
  bots.forEach((b,i)=>{
    const a = i / bots.length * Math.PI * 2;
    b.g.position.set(Math.cos(a)*2.5, 0, Math.sin(a)*2.5);
  });
  document.getElementById("feed").innerHTML += "<br><b>Hub:</b> Riunione convocata!";
}
function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
function animate(){
  requestAnimationFrame(animate);
  bots.forEach(b => b.g.rotation.y += 0.008);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
