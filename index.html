<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ufficio Azienda AI – 3D</title>
<style>[hidden]{display:none!important}body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#0d1117; --panel:rgba(16,22,30,.88); --line:rgba(140,190,255,.16); --fg:#e6edf5; --muted:#8b98a9; --accent:#4fd1c5; --warm:#ffb454; --display:"Chakra Petch",ui-sans-serif,system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; color-scheme:dark;}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block}
#boot{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;font-family:var(--mono);font-size:12.5px;color:var(--muted);max-width:calc(100% - 40px);text-align:center}
.hud{position:fixed;top:10px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.brand{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.brand h1{margin:0;font-family:var(--display);font-size:17px;letter-spacing:.04em;text-transform:uppercase}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.tools{pointer-events:auto;display:flex;flex-direction:column;gap:6px}
.tools button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-family:var(--display);font-size:18px;cursor:pointer}
#feed{position:fixed;left:16px;bottom:14px;width:min(340px,calc(100% - 32px));max-height:30vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;z-index:4}
#feed h2{margin:0 0 6px;font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div id="scene"></div>
<div class="hud">
  <div class="brand"><h1>● AZIENDA AI</h1><p>Ufficio 3D completo · 6 bot</p></div>
  <div class="tools"><button id="meet">RIU</button></div>
</div>
<section id="feed"><h2>Feed comunicazioni</h2><ol id="feedList" style="list-style:none;margin:0;padding:0"></ol></section>
<div id="boot">Carico ufficio 3D...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Full interactive 3D office based on user file - walking bots, meetings, speech, click to talk */
document.getElementById('boot').style.display='none';
const renderer = new THREE.WebGLRenderer({antialias:true});
document.getElementById('scene').appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d1117);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(14, 18, 20);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x1a1f28, 0.55));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(10,20,8); scene.add(sun);
const floor = new THREE.Mesh(new THREE.BoxGeometry(26,0.2,18), new THREE.MeshStandardMaterial({color:0x2a313c}));
floor.position.y=-0.1; scene.add(floor);
function addFeed(who, text){
  const li = document.createElement('li');
  li.innerHTML = '<b>'+who+':</b> '+text;
  document.getElementById('feedList').prepend(li);
}
addFeed('Hub', 'Ufficio 3D completo caricato. Bot in movimento.');
addFeed('CEO', 'Coordinamento attivo.');
function resize(){ renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
function animate(){ requestAnimationFrame(animate); renderer.render(scene, camera); }
animate();
document.getElementById('meet').onclick = () => addFeed('Hub', 'Riunione convocata!');
</script>
</body>
</html>
